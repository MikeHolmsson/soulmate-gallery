<script>
(()=>{
  const config=window.GALLERY_CONFIG;
  const feature=document.querySelector('.feature'),cards=[...document.querySelectorAll('.card')],photos=[...document.querySelectorAll('.portrait-set')],line=document.querySelector('.line'),count=document.querySelector('.count'),loading=document.querySelector('.loading-status');
  let people=[],pendingPeople=null,index=0,layer=0,timer,refreshTimer,duration=7000,externalUrl='',lastRefreshAt=0,nextDue=0,transitioning=false;
  const refreshMs=2*60*60*1000;
  let excludedNames=new Set();
  const cleanName=name=>name.trim().replace(/\s+/g,' ').toLocaleLowerCase('sv');
  let statusTimer;
  function showLoading(visible){clearTimeout(statusTimer);loading.classList.remove('error');loading.querySelector('.loading-label').textContent='Uppdaterar Soulmates…';loading.hidden=!visible}
  function showError(message){clearTimeout(statusTimer);loading.classList.add('error');loading.querySelector('.loading-label').textContent=message;loading.hidden=false;statusTimer=setTimeout(()=>loading.hidden=true,12000)}
  function imageSource(item,url){
    const base64=typeof item==='object'&&(item.base64||item.profileImageBase64);
    if(base64){
      if(base64.startsWith('data:image/'))return base64;
      const type=base64.startsWith('iVBOR')?'png':base64.startsWith('/9j/')?'jpeg':base64.startsWith('UklGR')?'webp':base64.startsWith('R0lG')?'gif':'png';
      return 'data:image/'+type+';base64,'+base64;
    }
    return new URL(typeof item==='string'?item:item.url,url).href;
  }
  async function getPeople(url){
    let payload;
    if(url==='embedded:')payload=config.fallbackPeople||JSON.parse(document.getElementById('fallback-people').textContent);
    else{
      const headers=config.apiKey?{[config.apiKeyHeader||'X-API-Key']:config.apiKey}:{};
      const response=await fetch(url,{cache:'no-store',headers});
      if(!response.ok)throw new Error('Kunde inte hämta personlistan: '+response.status);
      payload=await response.json();
    }
    const list=Array.isArray(payload)?payload:(payload.employees||payload.people);
    if(!Array.isArray(list)||!list.length)throw new Error('Personlistan är tom');
    const valid=list.filter(p=>p&&typeof p.name==='string'&&!excludedNames.has(cleanName(p.name))).map(p=>{
      const rawImages=Array.isArray(p.images)?p.images:(p.profileImageBase64?[{base64:p.profileImageBase64}]:p.image?[p.image]:[]);
      const images=rawImages.slice(0,2).filter(item=>item&&(typeof item==='string'||item.url||item.base64||item.profileImageBase64)).map(item=>({url:imageSource(item,url),alt:typeof item.alt==='string'?item.alt:''}));
      const rawFields=p.texts||p.fields||(p.text&&typeof p.text==='object'?p.text:[]);
      const entries=Array.isArray(rawFields)?rawFields:Object.entries(rawFields).map(([label,value])=>({label,value}));
      const fields=entries.filter(f=>f&&typeof (f.label||f.key)==='string'&&f.value!=null).map(f=>({label:f.label||f.key,value:Array.isArray(f.value)?f.value.join(', '):String(f.value)}));
      const summary=typeof p.intro==='string'?p.intro:typeof p.summary==='string'?p.summary:typeof p.text==='string'?p.text:'';
      const group=p.group||p.role||'Soulmate';
      const office=p.office||p.location||(/^Soulmates\s+(.+)$/i.exec(group)?.[1]||'');
      return {id:String(p.personioId||p.id||p.name),name:p.name,group,office,summary,fields,images};

    if(!valid.length)throw new Error('Inga giltiga personer');

  function fill(n,slot){

    const office=card.querySelector('.office');office.hidden=!p.office;office.querySelector('.office-name').textContent=p.office;
    const intro=card.querySelector('.intro');intro.textContent=p.summary;intro.hidden=!p.summary;
    card.classList.toggle('many-fields',p.fields.length>=5);
    const fields=card.querySelector('.profile-fields');fields.replaceChildren();
    for(const field of p.fields){
      const item=document.createElement('div'),label=document.createElement('dt'),value=document.createElement('dd');
      item.className='profile-field';label.textContent=field.label;value.textContent=field.value;
      item.append(label,value);fields.append(item);
    }
    set.classList.toggle('two',p.images.length===2);
    if(p.images.length===1){imgs[1].removeAttribute('src');imgs[1].alt=''}
    return Promise.all(p.images.map((image,i)=>new Promise(resolve=>{
      const img=imgs[i];img.alt=image.alt||'Porträtt av '+p.name+(i?' – bild 2':'');
      img.onload=resolve;img.onerror=resolve;img.src=image.url;
      if(img.complete)resolve();
    })));
  }
  function shuffle(list){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  const layouts=['left-high','left-low','right-high','right-low'];
  let layoutBag=[],previousLayout='';
  function changeLayout(){
    if(!layoutBag.length){
      layoutBag=[...layouts];shuffle(layoutBag);
      if(layoutBag.length>1&&layoutBag[layoutBag.length-1]===previousLayout){
        [layoutBag[0],layoutBag[layoutBag.length-1]]=[layoutBag[layoutBag.length-1],layoutBag[0]];
      }
    }
    previousLayout=layoutBag.pop();feature.dataset.layout=previousLayout;
  }
  function signature(list){return JSON.stringify(list.map(p=>[p.id,p.name,p.group,p.office,p.summary,p.fields,p.images]).sort((a,b)=>a[0].localeCompare(b[0])))}
  function schedule(){clearTimeout(timer);nextDue=Date.now()+duration;timer=setTimeout(next,duration)}
  async function refresh(){
    lastRefreshAt=Date.now();showLoading(true);let failed=false;
    try{
      const updated=await getPeople(externalUrl);
      if(signature(updated)!==signature(pendingPeople||people))pendingPeople=updated;
    }catch(e){failed=true;console.warn('Personlistan kunde inte uppdateras; behåller den senaste fungerande listan.',e)}
    finally{if(failed)showError('Visar senast sparade personer');else showLoading(false);clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,refreshMs)}
  }
  async function next(){
    if(!people.length||transitioning)return;
    transitioning=true;clearTimeout(timer);
    try{
    if(pendingPeople){
      const current=people[index];people=pendingPeople;pendingPeople=null;shuffle(people);
      if(people.length>1&&people[0].id===current.id){const swap=1+Math.floor(Math.random()*(people.length-1));[people[0],people[swap]]=[people[swap],people[0]]}
      index=-1;
    }
    if(index+1===people.length){
      const last=people[index];shuffle(people);
      if(people.length>1&&people[0].id===last.id){const swap=1+Math.floor(Math.random()*(people.length-1));[people[0],people[swap]]=[people[swap],people[0]]}
      index=-1;
    }
    const target=index+1,other=1-layer;
    await fill(target,other);
    changeLayout();
    cards[layer].classList.remove('active');photos[layer].classList.add('leaving');photos[layer].classList.remove('active');
    void photos[other].offsetWidth;
    cards[other].classList.add('active');photos[other].classList.add('active');
    layer=other;index=target;count.textContent=String(index+1).padStart(2,'0')+' / '+String(people.length).padStart(2,'0');
    line.classList.remove('play');void line.offsetWidth;line.classList.add('play');
    }finally{transitioning=false;schedule()}
  }
  async function start(){
    duration=Math.max(3000,Number(config.rotationMs)||7000);
    excludedNames=new Set((config.excludedNames||[]).map(cleanName));
    let loadFailed=false;
    if(config.apiUrl){
      const endpoint=new URL(config.apiUrl,location.href);
      for(const [key,value] of Object.entries(config.query||{}))endpoint.searchParams.set(key,String(value));
      externalUrl=endpoint.href;lastRefreshAt=Date.now();showLoading(true);
      try{people=await getPeople(externalUrl)}catch(e){loadFailed=true;console.warn('API:et kunde inte läsas; visar den inbyggda listan.',e)}
    }
    if(!people.length)people=await getPeople('embedded:');
    shuffle(people);
    changeLayout();
    await fill(0,0);photos[0].classList.add('active');count.textContent='01 / '+String(people.length).padStart(2,'0');if(loadFailed)showError('Visar exempeldata – API:et kunde inte nås');else showLoading(false);
    feature.style.setProperty('--duration',duration+'ms');line.style.setProperty('--duration',duration+'ms');line.classList.add('play');schedule();
    if(externalUrl)refreshTimer=setTimeout(refresh,refreshMs);
  }
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&people.length){
      if(!transitioning){clearTimeout(timer);timer=setTimeout(next,Math.max(0,nextDue-Date.now()))}
      if(externalUrl&&Date.now()-lastRefreshAt>=refreshMs){clearTimeout(refreshTimer);refresh()}
    }
  });
  start().catch(e=>{showLoading(false);cards[0].querySelector('.name').textContent='Personerna kunde inte läsas in';cards[0].querySelector('.intro').textContent='Kontrollera personlistans adress och försök igen.';console.error(e)});
})();
</script></body></html>
